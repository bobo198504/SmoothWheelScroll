name: macOS build

# Builds the two macOS .dylib files on GitHub's own macOS runners.
#
# WHY THIS EXISTS: the release machine is Windows and has no macOS SDK, so the macOS half of a
# release cannot be produced there. GitHub provides macOS runners for free, which turns "somebody
# please build this" into a two-minute automatic job and puts the artifacts next to the Windows
# DLLs where users expect them.
#
# The two architectures are built as SEPARATE files (not one universal binary), matching the four
# artifacts 1.8.1 ships: one per platform and architecture.
#
# A green job proves SDK compilation, linking and the exported entry point. It does not prove wheel
# behaviour inside REAPER; that still requires a physical-Mac test.

on:
  workflow_dispatch: # run it by hand from the Actions tab
  push:
    tags:
      - 'v*' # and automatically for every version tag
  pull_request:
    paths:
      - 'src/**'
      - 'build.sh'
      - 'test/check_macos.sh'
      - '.github/workflows/macos.yml'

permissions:
  contents: write # needed to attach the artifacts to a release

jobs:
  build:
    # macos-latest rather than a pinned macos-14: the pinned name resolved to a runner label this
    # account cannot use ("macos-14-arm64-us-default is not supported"), and the build needs no
    # particular macOS version -- -mmacosx-version-min=10.13 is set in build.sh, so whatever SDK the
    # runner carries still produces binaries that run on 10.13 and later.
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcrun --show-sdk-path
          xcrun --sdk macosx --show-sdk-version
          clang++ --version

      - name: Check the macOS host contract
        run: bash test/check_macos.sh

      - name: Build both architectures
        run: |
          # bash explicitly: the executable bit on build.sh is not set in the repo (it is 100644),
          # and chmod-ing it here would be a workaround for a problem the build does not have.
          bash build.sh --mac

      - name: Show what was produced
        run: |
          ls -la build/
          file build/*.dylib
          for f in build/*.dylib; do
            echo "--- $f"
            lipo -info "$f"
            # The entry point MUST be exported or REAPER will not load the plugin at all.
            nm -gU "$f" | grep -i _ReaperPluginEntry || {
              echo "MISSING EXPORT in $f"; exit 1;
            }
          done

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dylibs
          path: build/*.dylib
          if-no-files-found: error

      # Only on a tag, and only if the build actually produced both files: attaching a broken or
      # partial set to a published release is worse than attaching nothing.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          count=$(ls build/*.dylib 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -ne 2 ]; then
            echo "expected 2 dylibs, found $count -- not touching the release"
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" build/*.dylib --clobber --repo "$GITHUB_REPOSITORY"
          else
            # A tag can be pushed before its release page is created. Keep the green build and its
            # downloadable workflow artifact; do not turn "release not created yet" into a build
            # failure that hides perfectly good dylibs.
            echo "release $tag does not exist yet; leaving the dylibs as workflow artifacts"
          fi
